<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月度飲食追蹤器 - 專業版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js" type="module"></script>
    <style>
        [v-cloak] { display: none; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 231, 235, 0.3);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }
        .day-cell {
            aspect-ratio: 1.1 / 1;
            transition: all 0.2s;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .auth-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">
    <div id="app" v-cloak>
        
        <!-- 1. 登入/註冊頁面 -->
        <div v-if="!user && authInitialized" class="min-h-screen auth-bg flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-8 space-y-6">
                <div class="text-center">
                    <h1 class="text-3xl font-black text-indigo-600 mb-2">飲食追蹤器</h1>
                    <p class="text-slate-400 text-sm">{{ isLoginMode ? '歡迎回來，請登入您的帳號' : '建立新帳號以開始追蹤' }}</p>
                </div>

                <!-- Google 登入按鈕 -->
                <button @click="handleGoogleLogin" :disabled="loading" class="w-full flex items-center justify-center gap-3 border-2 border-slate-100 py-3 rounded-xl font-bold hover:bg-slate-50 transition text-slate-600">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    使用 Google 帳號登入
                </button>

                <div class="flex items-center gap-4 my-4">
                    <div class="h-px bg-slate-100 flex-grow"></div>
                    <span class="text-xs text-slate-300 font-bold uppercase">或使用信箱</span>
                    <div class="h-px bg-slate-100 flex-grow"></div>
                </div>

                <form @submit.prevent="handleAuth" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">電子郵件</label>
                        <input type="email" v-model="authForm.email" required class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-indigo-100 transition" placeholder="example@mail.com">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">密碼</label>
                        <input type="password" v-model="authForm.password" required class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-indigo-100 transition" placeholder="••••••••">
                    </div>
                    
                    <div v-if="authError" class="bg-rose-50 text-rose-500 text-xs p-3 rounded-lg border border-rose-100">
                        {{ authError }}
                    </div>

                    <button type="submit" :disabled="loading" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-100 disabled:opacity-50">
                        {{ loading ? '處理中...' : (isLoginMode ? '立即登入' : '註冊帳號') }}
                    </button>
                </form>

                <div class="text-center border-t pt-6">
                    <button @click="isLoginMode = !isLoginMode; authError = ''" class="text-sm font-medium text-indigo-600 hover:underline">
                        {{ isLoginMode ? '還沒有帳號？點此註冊' : '已有帳號？返回登入' }}
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. 主應用程式 (追蹤器) -->
        <div v-if="user" class="max-w-[1600px] mx-auto px-4 py-6">
            <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-indigo-600 flex items-center">
                        <span class="mr-2">📅</span> 月度飲食追蹤器
                    </h1>
                    <div class="flex items-center gap-3 mt-1">
                        <div class="flex items-center gap-1.5">
                            <span class="inline-block w-2 h-2 bg-emerald-500 rounded-full"></span>
                            <p class="text-[10px] text-slate-500 font-mono">{{ user.email || 'Google 使用者' }}</p>
                        </div>
                        <button @click="handleLogout" class="text-[10px] text-rose-500 hover:underline font-bold">登出</button>
                    </div>
                </div>
                
                <div class="flex gap-2 items-center">
                    <button @click="exportMonthCSV" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg transition text-xs flex items-center">
                        📥 匯出 CSV
                    </button>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <!-- 左側：模板 + 月曆 -->
                <aside class="lg:col-span-4 space-y-5">
                    <!-- 此處省略模板介面以保持程式碼精簡 -->
                    <section class="glass-card p-4 rounded-xl shadow-sm text-center">
                        歡迎進入管理介面
                    </section>
                </aside>
                <main class="lg:col-span-8">
                    <div class="glass-card p-10 rounded-xl text-center">
                        開始追蹤您的健康生活吧！
                    </div>
                </main>
            </div>
        </div>

        <!-- 儲存指示 -->
        <div v-if="saving" class="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-2.5 rounded-full text-xs shadow-2xl flex items-center gap-3 z-50">
            正在同步...
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { createApp, ref, reactive, onMounted, watch } = Vue;

        /**
         * 安全部署建議：
         * 1. 不要在此處硬編碼敏感資訊。
         * 2. 在 Firebase Console 限制此 API Key 僅限您的 GitHub Pages 網域使用。
         * 3. 確保 Firestore 安全規則已啟用身分驗證檢查。
         */
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSy...", // 這裡填入你的 Key
            authDomain: "loseweight-4b745.firebaseapp.com",
            projectId: "loseweight-4b745",
            storageBucket: "loseweight-4b745.firebasestorage.app",
            messagingSenderId: "76431868318",
            appId: "1:76431868318:web:98e0267325ea1fd9f8d68f"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'my-diet-tracker-v1';

        createApp({
            setup() {
                const user = ref(null);
                const authInitialized = ref(false);
                const isLoginMode = ref(true);
                const loading = ref(false);
                const authError = ref('');
                const authForm = reactive({ email: '', password: '' });
                const saving = ref(false);
                const plans = reactive({
                    high: { calories: 2500, carbs: 350, protein: 180, fat: 50 },
                    med: { calories: 2000, carbs: 200, protein: 180, fat: 60 },
                    low: { calories: 1800, carbs: 80, protein: 180, fat: 85 },
                    rest: { calories: 1600, carbs: 50, protein: 150, fat: 90 }
                });
                const allData = reactive({});

                // 認證邏輯
                const handleGoogleLogin = async () => {
                    loading.value = true;
                    try { await signInWithPopup(auth, new GoogleAuthProvider()); } 
                    catch (e) { authError.value = e.message; }
                    finally { loading.value = false; }
                };

                const handleAuth = async () => {
                    loading.value = true;
                    try {
                        if (isLoginMode.value) await signInWithEmailAndPassword(auth, authForm.email, authForm.password);
                        else await createUserWithEmailAndPassword(auth, authForm.email, authForm.password);
                    } catch (e) { authError.value = "驗證失敗: " + e.message; }
                    finally { loading.value = false; }
                };

                const handleLogout = () => signOut(auth).then(() => location.reload());

                // 同步數據 (使用 userId 路徑確保安全性)
                watch(user, (u) => {
                    if (u) {
                        const docRef = doc(db, 'artifacts', appId, 'users', u.uid, 'data', 'records');
                        onSnapshot(docRef, (snap) => {
                            if (snap.exists()) {
                                const data = snap.data();
                                if (data.plans) Object.assign(plans, data.plans);
                                if (data.records) Object.assign(allData, data.records);
                            }
                        }, (err) => console.error("資料存取受限：", err));
                    }
                });

                onMounted(() => {
                    onAuthStateChanged(auth, (u) => {
                        user.value = u;
                        authInitialized.value = true;
                    });
                });

                return { 
                    user, authInitialized, isLoginMode, loading, authError, authForm,
                    handleGoogleLogin, handleAuth, handleLogout, plans, allData, saving
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
